<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple and responsive To-Do List app.">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">STAY ORGANIZED</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">Small steps make big progress.</p>
    </header>

    <section class="todo-card" aria-label="To-do list">
      <form id="todo-form" class="todo-form">
        <label class="sr-only" for="task-input">Enter a task</label>
        <input
          id="task-input"
          type="text"
          placeholder="What do you need to do?"
          maxlength="120"
          autocomplete="off"
          required
        >
        <button type="submit" class="add-button">Add task</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <div class="list-heading">
        <h2>Your tasks</h2>
        <span id="task-count" class="task-count">0 tasks</span>
      </div>

      <ul id="task-list" class="task-list" aria-label="Tasks">
        <!-- Tasks are added here by JavaScript. -->
      </ul>

      <p id="empty-state" class="empty-state">
        No tasks yet. Add your first task above!
      </p>
      <footer class="card-footer">
        <span id="progress-text">0 completed</span>
        <button id="clear-completed" class="text-button" type="button">
          Clear completed
        </button>
      </footer>
    </section>
    <p class="page-note">Your tasks are saved in this browser.</p>
  </main>
</body>
</html>
